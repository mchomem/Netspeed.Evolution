<div class="input-area rounded-pill col">
    <label for="input-taskName" class="label-text-input d-flex">
        <input type="text" placeholder="Adicione um novo item" id="input-taskName" class="form-control me-2 col" autocomplete="off" #textInput 
            (keydown.enter)="addItem(textInput.value)">
        <button class="btn btn-outline-primary-navy rounded-circle" title="Adicionar novo item" (click)="addItem(textInput.value)">
            <i class="fa-solid fa-plus"></i>
        </button>
    </label>
</div>
