<div class="col">
    <div class="mb-3">
        <h4>
            Colaboradores
        </h4>
    </div>
    <div class="text-end mb-3">
        <button type="button" class="btn btn-secondary">
            + Novo Colaborador
        </button>
    </div>
    <table class="table table-hover table-striped mb-5">
        <thead class="table-dark">
            <tr>
                <th class="rounded-start-1 border-0 px-md-3 custom-py-3 text-start" style="width: 40%;">
                    Nome do Colaborador
                </th>
                <th class="border-0 px-md-3 custom-py-3 text-start" style="width: 40%;">
                    E-mail
                </th>
                <th class="rounded-end-1 border-0 px-md-3 custom-py-3" style="width: 20%;">
                    Situação
                </th>
            </tr>
        </thead>
        <tbody>
            <tr class="clickable-row border-bottom border-dark-subtle d-none" title="Clique para abrir a tarefa">
                <td class="px-md-3 custom-py-3 evolution-bg-primary rounded-start-1">

                </td>
                <td class="px-md-3 custom-py-3 evolution-bg-primary">

                </td>
                <td class="px-md-3 custom-py-3 evolution-bg-primary rounded-end-1">

                </td>
            </tr>
            <tr class="clickable-row border-bottom border-dark-subtle">
                <td colspan="3" class="px-md-3 custom-py-3 evolution-bg-primary rounded-2">
                    Nenhum colaborador cadastrado
                </td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</div>
