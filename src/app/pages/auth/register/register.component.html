<div class="col-md-3 m-auto mt-5 pt-5">
    <form class="text-center"> 
        <img class="mb-5" src="assets/logo-text_only_black.png" alt="Logo" width="150">
        <h1 class="h3 mb-4 fw-normal">
            Crie sua conta
        </h1>
        <div class="form-floating mb-3"> 
            <input type="text" class="form-control" #inputName placeholder="Nome"> 
            <label for="inputName">Nome</label> 
        </div>
        <div class="form-floating mb-3"> 
            <input type="email" class="form-control" #inputEmail placeholder="E-mail"> 
            <label for="floatingInput">E-mail</label> 
        </div>
        <div class="form-floating mb-4">
            <input type="password" class="form-control" #inputPassword placeholder="Senha">
            <label for="floatingPassword">Senha</label> 
        </div>
        <div class="form-floating mb-4">
            <input type="password" class="form-control" #inputPassword placeholder="Confirmar Senha">
            <label for="floatingPassword">Confirmar Senha</label> 
        </div>
        <button class="btn btn-primary-blue w-100 py-2 mb-3" type="submit">
            Criar conta
        </button>
        <a class="btn fw-bold w-100 py-2" href="/auth/login">
            Já tenho conta
        </a>
    </form>
</div>
